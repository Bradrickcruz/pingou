services:
  pingou:
    build:
      context: .
      args:
        VERSION: "1.4.0"
        COMMIT: "local"
        BUILD_DATE: "2026-11-02T14:18:34Z"
    ports:
      - "8956:8956"
    env_file:
      - .env
    volumes:
      - pingou_data:/data
    restart: unless-stopped
    # o Pingou tem até 15 s para desligar com calma; o padrão do Docker (10 s)
    # mataria o processo antes
    stop_grace_period: 20s

volumes:
  pingou_data:
