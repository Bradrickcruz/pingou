services:
  pingou:
    build:
      context: .
      args:
        VERSION: "1.3.0"
        COMMIT: "local"
        BUILD_DATE: "2026-04-24T19:37:34Z"
    ports:
      - "8956:8956"
    environment:
      - PINGOU_DATABASE_URL=/data/pingou.db
      - PINGOU_API_KEY=dev-api-key
      - PINGOU_LOG_LEVEL=info
    volumes:
      - pingou_data:/data
    restart: unless-stopped

volumes:
  pingou_data:
